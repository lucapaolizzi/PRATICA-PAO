<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>Silver — Agente P.A.O.</title>
<meta name="description" content="Silver — Agente P.A.O.">
<style>
:root{
  --bg:#f5f0e6; --ink:#24231f; --muted:#716d64;
  --gold:#a8833e; --line:rgba(36,35,31,.16); --paper:#fbf8f1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100dvh;
}
.shell{
  width:min(760px,100%);
  min-height:100dvh;
  margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 18px
          calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
.topbar{
  min-height:34px; display:flex; align-items:flex-start; justify-content:space-between;
  position:relative; z-index:20;
}
.back{
  color:var(--muted); text-decoration:none; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; padding:10px 12px 10px 0;
  display:inline-block;
  position:relative; z-index:21;
  touch-action:manipulation;
}
.back:focus-visible,.send:focus-visible,.mic:focus-visible,.listen:focus-visible,textarea:focus-visible{
  outline:2px solid var(--gold);outline-offset:3px
}
.identity{text-align:center;padding:4px 0 10px;transform:translateY(-58px)}
.silver{font-size:14px;letter-spacing:.26em;margin-left:.26em;margin-top:8px;font-weight:600}
.mascot-wrap{text-align:center;margin:0 auto 4px}
.mascot{
  display:block;
  width:min(235px,62vw);
  height:auto;
  margin:0 auto;
  filter:drop-shadow(0 10px 18px rgba(36,35,31,.10));
}
.stage{
  flex:1; display:flex; flex-direction:column; justify-content:center;
  padding:0 0 8px;
  transform:translateY(-58px);
}
.opening{text-align:center;margin:auto 0}
.hello{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(27px,6.7vw,40px); line-height:1.12; font-weight:400; margin:0 0 16px;
}
.question{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(21px,5.6vw,31px); line-height:1.28; margin:0;
}
.gentle{
  margin:8px 0 0;
  color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(16px,4.2vw,20px);
  line-height:1.35;
}
.conversation{display:none;flex-direction:column;gap:12px;padding:10px 0 22px}
.msg{
  max-width:88%; padding:12px 14px; border-radius:16px; line-height:1.45;
  font-size:15px; white-space:pre-wrap;
}
.msg.user{
  align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px
}
.silver-block{
  align-self:flex-start;
  max-width:88%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
}
.silver-block .msg.silver{
  max-width:100%;
}
.msg.silver{
  align-self:flex-start;background:var(--paper);border:1px solid var(--line);
  border-bottom-left-radius:5px;letter-spacing:normal;margin:0;font-weight:400
}
.listen{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:2px 4px;
  font:700 10px/1.2 Arial,Helvetica,sans-serif;
  letter-spacing:.10em;
  cursor:pointer;
}
.listen:hover{color:var(--ink)}
.listen[disabled]{opacity:.45;cursor:default}
.composer{
  border-top:1px solid var(--line); padding-top:10px;
  transform:translateY(-58px);
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:end;
}
textarea{
  width:100%; resize:none; min-height:66px; max-height:150px;
  border:1.5px solid rgba(36,35,31,.30); border-radius:15px; background:#fff;
  color:var(--ink); font:16px/1.4 Arial,Helvetica,sans-serif;
  padding:14px 15px; box-shadow:none;
}
textarea::placeholder{color:#918b80}
.send{
  min-height:66px;border:1px solid var(--ink);border-radius:15px;
  padding:0 14px;background:var(--ink);color:#fff;font-weight:700;
  font-size:11px;letter-spacing:.12em;cursor:pointer;
}
.mic{
  width:58px;min-height:66px;border:1.5px solid rgba(36,35,31,.30);
  border-radius:15px;background:#fff;color:var(--ink);
  font:700 19px/1 Arial,Helvetica,sans-serif;cursor:pointer;
  touch-action:manipulation;
}
.mic.recording{
  font-size:10px;letter-spacing:.08em;
}
.mic[disabled]{opacity:.50;cursor:default}
.mic-status{
  grid-column:1/-1;
  min-height:15px;
  margin:-3px 2px 0;
  color:var(--muted);
  font:11px/1.25 Arial,Helvetica,sans-serif;
  letter-spacing:.02em;
}
@media(max-height:760px){
  .mascot{width:min(205px,54vw)}
  .identity{padding-bottom:4px}
  .stage{padding:0 0 6px}
  .hello{margin-bottom:12px}
  .gentle{margin-top:6px}
}
@media(max-height:680px){
  .mascot{width:min(180px,48vw)}
  .hello{font-size:30px}
  .question{font-size:22px}
}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="/agente/patto/" id="backLink">INDIETRO</a>
  </div>

  <header class="identity" aria-label="Silver, Agente P.A.O.">
    <div class="mascot-wrap">
      <img class="mascot" src="silver.png" alt="Silver, Agente P.A.O.">
    </div>
    <div class="silver">SILVER</div>
  </header>

  <section class="stage">
    <div class="opening" id="opening">
      <h1 class="hello">Ciao, piacere, sono Silver.</h1>
      <p class="question">Da dove vuoi cominciare?</p>
      <p class="gentle">Puoi scrivermi anche solo una parola…</p>
    </div>
    <div class="conversation" id="conversation" aria-live="polite"></div>
  </section>

  <form class="composer" id="composer">
    <button class="mic" id="micButton" type="button"
      aria-label="Detta un messaggio" title="Detta un messaggio">🎤</button>
    <textarea id="input" rows="1" maxlength="3000"
      placeholder="Scrivi o parla…" aria-label="Messaggio per Silver" autofocus></textarea>
    <button class="send" type="submit">INVIA</button>
    <div class="mic-status" id="micStatus" aria-live="polite"></div>
  </form>
</main>

<script>
const WORKER_URL = 'https://silver-pao.paolizzi.workers.dev/';
const SPEECH_URL = WORKER_URL + 'speech';
const TRANSCRIBE_URL = WORKER_URL + 'transcribe';


const backLink = document.getElementById('backLink');
backLink.addEventListener('click', e=>{
  e.preventDefault();
  if(window.history.length > 1){
    window.history.back();
  }else{
    window.location.href = '/agente/patto/';
  }
});

const form = document.getElementById('composer');
const input = document.getElementById('input');
const opening = document.getElementById('opening');
const conversation = document.getElementById('conversation');
const send = form.querySelector('.send');
const micButton = document.getElementById('micButton');
const micStatus = document.getElementById('micStatus');

let mediaRecorder = null;
let micStream = null;
let micChunks = [];
let micMimeType = '';
let micBusy = false;
let micTimer = null;

const sessionMessages = [];

let activeAudio = null;
let activeAudioUrl = null;
let activeListenButton = null;
let activePaused = false;
let activeAudioDone = null;
let playbackRunId = 0;

function cleanDisplayText(text){
  let s = String(text)
    .replace(/^\s*#{1,6}\s+/gm,'');

  // Conserva il grassetto **testo**, ma rimuove in modo affidabile
  // gli asterischi del corsivo singolo, per esempio *Stop* -> Stop.
  const bold = [];
  s = s.replace(/\*\*([^*]+)\*\*/g,(_,inner)=>{
    const i = bold.push(inner) - 1;
    return `@@SILVER_BOLD_${i}@@`;
  });

  s = s.replace(/\*([^*\n]+)\*/g,'$1');

  s = s.replace(/@@SILVER_BOLD_(\d+)@@/g,(_,i)=>{
    return `**${bold[Number(i)]}**`;
  });

  return s;
}

function renderMessage(el, text, who){
  const cleaned = cleanDisplayText(text);

  if(who !== 'silver'){
    el.textContent = cleaned;
    return;
  }

  // Rendering sicuro del solo grassetto Markdown **testo**.
  const parts = cleaned.split(/(\*\*[^*]+\*\*)/g);

  for(const part of parts){
    if(!part) continue;

    if(part.startsWith('**') && part.endsWith('**')){
      const strong = document.createElement('strong');
      strong.textContent = part.slice(2, -2);
      el.appendChild(strong);
    }else{
      el.appendChild(document.createTextNode(part));
    }
  }
}

function splitForSpeech(text, maxLen=320){
  const cleaned = cleanDisplayText(text)
    .replace(/\*\*/g,'')
    .replace(/\s+/g,' ')
    .trim();

  if(cleaned.length <= maxLen) return [cleaned];

  const sentences = cleaned.match(/[^.!?;:]+[.!?;:]?|[^.!?;:]+$/g) || [cleaned];
  const chunks = [];
  let current = '';

  for(const sentenceRaw of sentences){
    const sentence = sentenceRaw.trim();
    if(!sentence) continue;

    if((current + ' ' + sentence).trim().length <= maxLen){
      current = (current + ' ' + sentence).trim();
      continue;
    }

    if(current){
      chunks.push(current);
      current = '';
    }

    if(sentence.length <= maxLen){
      current = sentence;
    }else{
      const words = sentence.split(/\s+/);
      let piece = '';
      for(const word of words){
        if((piece + ' ' + word).trim().length > maxLen){
          if(piece) chunks.push(piece);
          piece = word;
        }else{
          piece = (piece + ' ' + word).trim();
        }
      }
      if(piece) current = piece;
    }
  }

  if(current) chunks.push(current);
  return chunks.filter(Boolean);
}

async function fetchSpeechChunk(text){
  const response = await fetch(SPEECH_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      text,
      voice:'cedar',
      style:'cedar2cplus'
    })
  });

  if(!response.ok){
    throw new Error('Voce non disponibile');
  }

  return await response.blob();
}

async function speakSilver(text, button){
  // Se stiamo già ascoltando QUESTO messaggio:
  // tocco = PAUSA / RIPRENDI dallo stesso punto.
  if(activeListenButton === button && activeAudio){
    if(activePaused){
      activePaused = false;
      button.textContent = 'Ⅱ PAUSA';
      try{
        await activeAudio.play();
      }catch(err){
        console.error('Ripresa voce:',err);
      }
    }else{
      activePaused = true;
      activeAudio.pause();
      button.textContent = '▶ RIPRENDI';
    }
    return;
  }

  // Ferma un'eventuale altra lettura.
  if(activeListenButton && activeListenButton !== button){
    playbackRunId++;

    if(activeAudio){
      activeAudio.pause();
      activeAudio = null;
    }
    if(activeAudioUrl){
      URL.revokeObjectURL(activeAudioUrl);
      activeAudioUrl = null;
    }
    activeListenButton.textContent = '🔊 ASCOLTA';
    activeListenButton.disabled = false;
    activeListenButton = null;
    activePaused = false;
  }

  const chunks = splitForSpeech(text);
  const myRunId = ++playbackRunId;

  activeListenButton = button;
  activePaused = false;
  button.disabled = false;
  button.textContent = chunks.length > 1 ? '… PREPARO AUDIO' : '…';

  try{
    // PRECARICA TUTTI I BLOCCHI prima di iniziare.
    // Su iPhone evita che la lettura si interrompa tra un blocco e il successivo.
    const blobs = [];
    for(let i=0;i<chunks.length;i++){
      if(myRunId !== playbackRunId) return;

      button.textContent = chunks.length > 1
        ? '… PREPARO ' + (i+1) + '/' + chunks.length
        : '…';

      const blob = await fetchSpeechChunk(chunks[i]);
      blobs.push(blob);
    }

    if(myRunId !== playbackRunId) return;

    // Riproduzione continua dei blocchi già pronti.
    for(let i=0;i<blobs.length;i++){
      if(myRunId !== playbackRunId) return;

      if(activeAudioUrl){
        URL.revokeObjectURL(activeAudioUrl);
        activeAudioUrl = null;
      }

      activeAudioUrl = URL.createObjectURL(blobs[i]);
      activeAudio = new Audio(activeAudioUrl);
      activePaused = false;

      button.textContent = blobs.length > 1
        ? 'Ⅱ PAUSA · ' + (i+1) + '/' + blobs.length
        : 'Ⅱ PAUSA';

      await new Promise((resolve,reject)=>{
        let settled = false;

        const finish = ()=>{
          if(settled) return;
          settled = true;
          resolve();
        };

        activeAudio.addEventListener('ended',finish,{once:true});
        activeAudio.addEventListener('error',()=>{
          if(settled) return;
          settled = true;
          reject(new Error('Errore riproduzione voce'));
        },{once:true});

        activeAudio.play().catch(reject);
      });

      if(myRunId !== playbackRunId) return;
    }

    if(activeAudioUrl){
      URL.revokeObjectURL(activeAudioUrl);
      activeAudioUrl = null;
    }

    if(myRunId === playbackRunId && activeListenButton === button){
      button.textContent = '🔊 ASCOLTA';
      button.disabled = false;
      activeListenButton = null;
      activePaused = false;
      activeAudio = null;
    }

  }catch(err){
    if(myRunId !== playbackRunId) return;

    if(activeAudio){
      activeAudio.pause();
      activeAudio = null;
    }
    if(activeAudioUrl){
      URL.revokeObjectURL(activeAudioUrl);
      activeAudioUrl = null;
    }

    button.textContent = '🔊 ASCOLTA';
    button.disabled = false;
    activeListenButton = null;
    activePaused = false;
    console.error('Silver voce:',err);
  }
}

function addMessage(text, who){
  if(who !== 'silver'){
    const el=document.createElement('div');
    el.className='msg '+who;
    renderMessage(el,text,who);
    conversation.appendChild(el);
    return el;
  }

  const block=document.createElement('div');
  block.className='silver-block';

  const el=document.createElement('div');
  el.className='msg silver';
  renderMessage(el,text,'silver');

  const listen=document.createElement('button');
  listen.type='button';
  listen.className='listen';
  listen.textContent='🔊 ASCOLTA';
  listen.setAttribute('aria-label','Ascolta la risposta di Silver');
  listen.dataset.speaking = '0';
  listen.addEventListener('click',()=>speakSilver(text,listen));

  block.appendChild(el);
  block.appendChild(listen);
  conversation.appendChild(block);

  return block;
}

function preferredAudioType(){
  if(!window.MediaRecorder) return '';

  const types = [
    'audio/mp4',
    'audio/webm;codecs=opus',
    'audio/webm'
  ];

  for(const type of types){
    if(MediaRecorder.isTypeSupported(type)) return type;
  }

  return '';
}

function extensionForMime(type){
  if(String(type).includes('mp4')) return 'm4a';
  if(String(type).includes('webm')) return 'webm';
  return 'audio';
}

function resetMicUi(){
  micBusy = false;
  micButton.disabled = false;
  micButton.classList.remove('recording');
  micButton.textContent = '🎤';
  micButton.setAttribute('aria-label','Detta un messaggio');
  micButton.title = 'Detta un messaggio';
  micStatus.textContent = '';
}

function stopMicTracks(){
  if(micStream){
    for(const track of micStream.getTracks()){
      track.stop();
    }
    micStream = null;
  }
}

async function transcribeRecording(blob){
  micBusy = true;
  micButton.disabled = true;
  micButton.classList.remove('recording');
  micButton.textContent = '…';
  micStatus.textContent = 'Trascrivo quello che hai detto…';

  try{
    const data = new FormData();
    const ext = extensionForMime(blob.type || micMimeType);
    data.append('audio', blob, 'registrazione.' + ext);

    const response = await fetch(TRANSCRIBE_URL,{
      method:'POST',
      body:data
    });

    const result = await response.json();

    if(!response.ok || !result.ok){
      throw new Error(result.error || 'Trascrizione non disponibile');
    }

    const spokenText = String(result.text || '').trim();

    if(spokenText){
      const existing = input.value.trim();
      input.value = existing
        ? existing + ' ' + spokenText
        : spokenText;

      resize();
      input.focus();
      input.setSelectionRange(input.value.length,input.value.length);
      micStatus.textContent = 'Testo pronto: controllalo e poi premi INVIA.';
      setTimeout(()=>{
        if(!micBusy) micStatus.textContent = '';
      },3500);
    }

  }catch(err){
    console.error('Microfono Silver:',err);
    micStatus.textContent = 'Non sono riuscito a trascrivere. Puoi riprovare.';
  }finally{
    micBusy = false;
    micButton.disabled = false;
    micButton.classList.remove('recording');
    micButton.textContent = '🎤';
    micButton.setAttribute('aria-label','Detta un messaggio');
    micButton.title = 'Detta un messaggio';
  }
}

async function startMicrophone(){
  if(micBusy) return;

  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
    micStatus.textContent = 'Il microfono non è disponibile in questo browser.';
    return;
  }

  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true
      }
    });

    micChunks = [];
    micMimeType = preferredAudioType();

    mediaRecorder = micMimeType
      ? new MediaRecorder(micStream,{mimeType:micMimeType})
      : new MediaRecorder(micStream);

    mediaRecorder.addEventListener('dataavailable',event=>{
      if(event.data && event.data.size > 0){
        micChunks.push(event.data);
      }
    });

    mediaRecorder.addEventListener('stop',async ()=>{
      clearTimeout(micTimer);
      stopMicTracks();

      const finalType =
        mediaRecorder?.mimeType ||
        micMimeType ||
        'audio/webm';

      const blob = new Blob(micChunks,{type:finalType});
      mediaRecorder = null;
      micChunks = [];

      if(blob.size < 400){
        micStatus.textContent = 'Non ho ricevuto abbastanza audio. Riprova.';
        resetMicUi();
        return;
      }

      await transcribeRecording(blob);
    },{once:true});

    mediaRecorder.start();

    micButton.classList.add('recording');
    micButton.textContent = '⏹ FINE';
    micButton.setAttribute('aria-label','Ferma registrazione');
    micButton.title = 'Ferma registrazione';
    micStatus.textContent = 'Ti ascolto… premi FINE quando hai finito.';

    // Evita registrazioni lasciate aperte accidentalmente.
    micTimer = setTimeout(()=>{
      if(mediaRecorder && mediaRecorder.state === 'recording'){
        mediaRecorder.stop();
      }
    },60000);

  }catch(err){
    console.error('Permesso microfono:',err);
    stopMicTracks();
    resetMicUi();

    if(err?.name === 'NotAllowedError'){
      micStatus.textContent = 'Per usare il microfono devi consentirne l’accesso al browser.';
    }else{
      micStatus.textContent = 'Non riesco ad aprire il microfono. Riprova.';
    }
  }
}

micButton.addEventListener('click',()=>{
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    micButton.disabled = true;
    micStatus.textContent = 'Un momento…';
    mediaRecorder.stop();
    return;
  }

  startMicrophone();
});

function resize(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,150)+'px';
}

input.addEventListener('input',resize);

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text || send.disabled) return;

  opening.style.display='none';
  conversation.style.display='flex';
  document.querySelector('.mascot').style.width='92px';
  document.querySelector('.identity').style.paddingBottom='2px';

  addMessage(text,'user');
  sessionMessages.push({role:'user', content:text});

  input.value='';
  resize();

  send.disabled=true;
  send.textContent='…';

  try{
    const response = await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:text,
        history:sessionMessages
      })
    });

    const data = await response.json();
    if(!response.ok || !data.ok){
      throw new Error(data.error || 'Risposta non valida');
    }

    const reply = data.reply || 'Ti ho ricevuto.';
    addMessage(reply,'silver');
    sessionMessages.push({role:'assistant', content:reply});

    if(sessionMessages.length > 20){
      sessionMessages.splice(0, sessionMessages.length - 20);
    }
  }catch(err){
    addMessage('In questo momento non riesco a collegarmi. Riprova tra poco.','silver');
    console.error('Silver Worker:',err);
  }finally{
    send.disabled=false;
    send.textContent='INVIA';
    input.focus();
    conversation.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
});
</script>
</body>
</html>
