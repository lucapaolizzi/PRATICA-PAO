<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>Silver — Agente P.A.O.</title>
<meta name="description" content="Silver — Agente P.A.O.">
<style>
:root{
  --bg:#f5f0e6; --ink:#24231f; --muted:#716d64;
  --gold:#a8833e; --line:rgba(36,35,31,.16); --paper:#fbf8f1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100dvh;
}
.shell{
  width:min(760px,100%);
  min-height:100dvh;
  margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 18px
          calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
.topbar{
  min-height:34px; display:flex; align-items:flex-start; justify-content:space-between;
}
.back{
  color:var(--muted); text-decoration:none; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; padding:7px 0;
}
.back:focus-visible,.send:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.identity{text-align:center;padding:4px 0 10px;transform:translateY(-58px)}
.symbol{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:Arial,sans-serif; font-size:26px; line-height:.72; gap:4px;
  margin-bottom:11px;
}
.symbol span{display:block}
.brand{font-size:11px;letter-spacing:.30em;margin-left:.30em;color:var(--muted)}
.silver{font-size:14px;letter-spacing:.26em;margin-left:.26em;margin-top:8px;font-weight:600}
.mascot-wrap{
  text-align:center;
  margin:0 auto 4px;
}
.mascot{
  display:block;
  width:min(235px,62vw);
  height:auto;
  margin:0 auto;
  filter:drop-shadow(0 10px 18px rgba(36,35,31,.10));
}
.stage{
  flex:1; display:flex; flex-direction:column; justify-content:center;
  padding:0 0 8px;
  transform:translateY(-58px);
}
.opening{text-align:center;margin:auto 0}
.hello{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(27px,6.7vw,40px); line-height:1.12; font-weight:400; margin:0 0 16px;
}
.question{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(21px,5.6vw,31px); line-height:1.28; margin:0;
}
.question + .question{margin-top:5px}
.gentle{
  margin:8px 0 0;
  color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(16px,4.2vw,20px);
  line-height:1.35;
}
.conversation{display:none;flex-direction:column;gap:12px;padding:10px 0 22px}
.msg{
  max-width:88%; padding:12px 14px; border-radius:16px; line-height:1.45;
  font-size:15px; white-space:pre-wrap;
}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.msg.silver{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px;letter-spacing:normal;margin:0;font-weight:400}
.composer{
  border-top:1px solid var(--line); padding-top:10px;
  transform:translateY(-58px);
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;
}
textarea{
  width:100%; resize:none; min-height:66px; max-height:150px;
  border:1.5px solid rgba(36,35,31,.30); border-radius:15px; background:#fff;
  color:var(--ink); font:16px/1.4 Arial,Helvetica,sans-serif;
  padding:14px 15px; box-shadow:none;
}
textarea::placeholder{color:#918b80}
.send{
  min-height:66px;border:1px solid var(--ink);border-radius:15px;
  padding:0 14px;background:var(--ink);color:#fff;font-weight:700;
  font-size:11px;letter-spacing:.12em;cursor:pointer;
}
.note{
  text-align:center;color:var(--muted);font-size:10px;line-height:1.35;
  margin:10px auto 0;max-width:520px;
}
@media(max-height:760px){
  .mascot{width:min(205px,54vw)}
  .identity{padding-bottom:4px}
  .stage{padding:0 0 6px}
  .hello{margin-bottom:12px}
  .gentle{margin-top:6px}
}
@media(max-height:680px){
  .mascot{width:min(180px,48vw)}
  .hello{font-size:30px}
  .question{font-size:22px}
}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="/agente/patto/">INDIETRO</a>
  </div>

  <header class="identity" aria-label="Silver, Agente P.A.O.">
    <div class="mascot-wrap">
      <img class="mascot" src="silver.png" alt="Silver, Agente P.A.O.">
    </div>
    <div class="silver">SILVER</div>
  </header>

  <section class="stage">
    <div class="opening" id="opening">
      <h1 class="hello">Ciao, sono Silver.</h1>
      <p class="question">Da dove vuoi cominciare?</p>
      <p class="gentle">Puoi scrivermi anche solo una parola…</p>
    </div>
    <div class="conversation" id="conversation" aria-live="polite"></div>
  </section>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" maxlength="3000"
      placeholder="Scrivi qui quello che vuoi…" aria-label="Messaggio per Silver" autofocus></textarea>
    <button class="send" type="submit">INVIA</button>
  </form>
</main>

<script>
const WORKER_URL = 'https://silver-pao.paolizzi.workers.dev/';

const form = document.getElementById('composer');
const input = document.getElementById('input');
const opening = document.getElementById('opening');
const conversation = document.getElementById('conversation');
const send = form.querySelector('.send');

function addMessage(text, who){
  const el=document.createElement('div');
  el.className='msg '+who;
  el.textContent=text;
  conversation.appendChild(el);
  return el;
}

function resize(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,150)+'px';
}

input.addEventListener('input',resize);

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text || send.disabled) return;

  opening.style.display='none';
  conversation.style.display='flex';
  document.querySelector('.mascot').style.width='92px';
  document.querySelector('.identity').style.paddingBottom='2px';

  addMessage(text,'user');
  input.value='';
  resize();

  send.disabled=true;
  send.textContent='…';

  try{
    const response = await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})
    });

    const data = await response.json();
    if(!response.ok || !data.ok){
      throw new Error(data.error || 'Risposta non valida');
    }

    addMessage(data.reply || 'Ti ho ricevuto.','silver');
  }catch(err){
    addMessage('In questo momento non riesco a collegarmi. Riprova tra poco.','silver');
    console.error('Silver Worker:',err);
  }finally{
    send.disabled=false;
    send.textContent='INVIA';
    input.focus();
    conversation.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
});
</script>
</body>
</html>
