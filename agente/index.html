<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Silver — Agente P.A.O. | Pratica P.A.O.</title>
<meta name="description" content="Silver, Agente P.A.O. AI. Una pratica di presenza: Pratica, Mappa, Quaderno e Agente P.A.O.">
<meta property="og:title" content="Silver — Agente P.A.O.">
<meta property="og:description" content="Ho una mappa. Il territorio è il tuo. Insieme è più semplice.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://praticapao.it/agente/">
<meta property="og:image" content="https://praticapao.it/agente/AGENTE-PAO-SILVER-UFFICIALE.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://praticapao.it/agente/AGENTE-PAO-SILVER-UFFICIALE.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111}
body{font-family:Arial,sans-serif}
main{min-height:100vh}
.hero{position:relative;display:flex;justify-content:center;align-items:center;line-height:0;overflow:hidden}
.hero img{display:block;height:auto}
.hero .enter{position:absolute;display:block;border-radius:999px;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero .enter:focus{outline:3px solid #fff;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Mobile: locandina verticale attuale */
.hero-mobile{background:#111;min-height:100vh}
.hero-mobile .stage{position:relative;width:min(100vw,900px)}
.hero-mobile img{width:100%;max-width:900px}
.hero-mobile .enter{left:29%;width:42%;bottom:7.4%;height:6.2%}

/* Desktop: nuova hero orizzontale */
.hero-desktop{display:none;background:#111;min-height:100vh;padding:0}
.hero-desktop .stage{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#111}
.hero-desktop img{
  width:100vw;
  height:auto;
  max-height:100vh;
  object-fit:contain;
}
.hero-desktop .enter{
  left:39.5%;
  width:21.5%;
  bottom:6.3%;
  height:8.8%;
}

/* Solo desktop: saluto professionale di Silver */
.silver-greeting{
  position:absolute;
  z-index:3;
  top:8%;
  right:5.5%;
  width:min(28vw,410px);
  padding:18px 22px 20px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:22px;
  background:rgba(24,26,31,.58);
  box-shadow:0 14px 38px rgba(0,0,0,.24);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  line-height:1.12;
  text-align:left;
}
.silver-greeting .eyebrow{
  display:block;
  margin:0 0 8px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,.72);
}
.silver-greeting strong{
  display:block;
  margin:0 0 9px;
  font-size:clamp(24px,2.2vw,38px);
  line-height:1.02;
  letter-spacing:-.02em;
}
.silver-greeting p{
  margin:0;
  font-size:clamp(16px,1.35vw,21px);
  line-height:1.28;
  color:rgba(255,255,255,.92);
}
.silver-greeting p b{color:#fff}

@media (min-width: 861px){
  .hero-mobile{display:none}
  .hero-desktop{display:flex}
}

@media (min-width:861px) and (max-width:1100px){
  .silver-greeting{
    top:6%;
    right:3%;
    width:31vw;
    padding:14px 17px 16px;
  }
  .silver-greeting .eyebrow{font-size:10px}
  .silver-greeting strong{font-size:clamp(20px,2.1vw,29px)}
  .silver-greeting p{font-size:clamp(14px,1.3vw,18px)}
}
</style>
</head>
<body>
<main>
  <section class="hero hero-mobile" aria-label="Ingresso Silver mobile">
    <div class="stage">
      <img src="AGENTE-PAO-SILVER-UFFICIALE.png" alt="Silver, Agente P.A.O. AI, con Luca Pao. Una pratica di presenza: cosa sento, cosa scelgo, come agisco.">
      <a class="enter" href="/entra/" aria-label="Entra nelle quattro porte P.A.O.">
        <span class="sr-only">Entra nelle quattro porte P.A.O.</span>
      </a>
    </div>
  </section>

  <section class="hero hero-desktop" aria-label="Ingresso Silver desktop">
    <div class="stage">
      <img src="SILVER-HERO-DESKTOP.png" alt="Silver, Agente P.A.O. AI, con Luca Pao e Silver. Una pratica di presenza: Accettazione, Buona Relazione, Consapevolezza.">

      <div class="silver-greeting" aria-label="Saluto di Silver">
        <span class="eyebrow">AGENTE P.A.O.</span>
        <strong>Ciao, sono Silver.</strong>
        <p>Come stai?<br><b>Da dove vuoi cominciare?</b></p>
      </div>

      <a class="enter" href="/entra/" aria-label="Entra nelle quattro porte P.A.O.">
        <span class="sr-only">Entra nelle quattro porte P.A.O.</span>
      </a>
    </div>
  </section>
</main>
</body>
</html>
